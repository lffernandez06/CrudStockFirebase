<div
  class="
  bg-linear-to-br from-amber-50 via-white to-indigo-50
  w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg
  h-dvh
  shrink-0
  flex flex-col
  p-6 mx-auto
  rounded-2xl shadow-xl
  overflow-y-auto
  "
>

  <!-- Header -->
  <div class="text-center mb-6">



    <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900">
      Add Product
    </h2>

    <p class="text-sm text-gray-500 mt-1">
      Create a new product
    </p>

  </div>


  <form class="flex flex-col gap-5 w-full">


    <!-- Name -->
    <div class="flex flex-col">

      <label class="mb-2 text-sm font-semibold text-gray-700">
        Product Name
      </label>

      <input
        type="text"
        placeholder="Example: T-Shirt"
        class="
        w-full px-4 py-3
        bg-white
        border border-gray-200
        text-gray-400
        rounded-xl
        shadow-sm
        focus:ring-2 focus:ring-indigo-500
        focus:border-indigo-500
        outline-none
        transition
        "
        [value]="name()"
        (input)="name.set(txtName.value)"
        #txtName
      />

    </div>



    <!-- Quantity -->
    <div class="flex flex-col">

      <label class="mb-2 text-sm font-semibold text-gray-700">
        Quantity
      </label>

      <input
        type="number"
        placeholder="0"
        class="
        w-full px-4 py-3
        bg-white
        border border-gray-200
        rounded-xl
        shadow-sm
        focus:ring-2 focus:ring-indigo-500
        outline-none
        transition
        "
        [value]="quantity()"
        (input)="quantity.set(+txtQuantity.value)"
        #txtQuantity
      />

    </div>




    <!-- Price -->
    <div class="flex flex-col">

      <label class="mb-2 text-sm font-semibold text-gray-700">
        Price
      </label>

      <div class="relative">

        <span class="absolute left-4 top-3 text-gray-400">
          $
        </span>

        <input
          type="number"
          placeholder="0.00"
          class="
          w-full pl-8 pr-4 py-3
          bg-white
          border border-gray-200
          rounded-xl
          shadow-sm
          focus:ring-2 focus:ring-indigo-500
          outline-none
          transition
          "
          [value]="price()"
          (input)="price.set(+txtPrice.value)"
          #txtPrice
        />

      </div>

    </div>




    <!-- Image -->
    <div class="flex flex-col">

      <label class="mb-2 text-sm font-semibold text-gray-700">
        Image URL
      </label>

      <input
        type="text"
        placeholder="https://image.com/product.png"
        class="
        w-full px-4 py-3
        bg-white
        border border-gray-200
        text-gray-400
        rounded-xl
        shadow-sm
        focus:ring-2 focus:ring-indigo-500
        outline-none
        transition
        "
        [value]="image()"
        (input)="image.set(txtImage.value)"
        #txtImage
      />

    </div>




    <!-- Description -->
    <div class="flex flex-col">

      <label class="mb-2 text-sm font-semibold text-gray-700">
        Description
      </label>

      <textarea
        rows="4"
        placeholder="Product description..."
        class="
        resize-none
        w-full px-4 py-3
        bg-white
        border border-gray-200
        text-gray-400
        rounded-xl
        shadow-sm
        focus:ring-2 focus:ring-indigo-500
        outline-none
        transition
        "
        [value]="description()"
        (input)="description.set(txtDescription.value)"
        #txtDescription
      ></textarea>

    </div>


  </form>



  <!-- Button -->
  <button
    (click)="addCard()"
    type="button"
    class="
    mt-8 mb-2
    w-full
    py-3 px-6
    rounded-xl
    bg-linear-to-r
    from-indigo-600
    to-blue-500
    text-white
    font-bold
    uppercase
    shadow-lg
    hover:scale-[1.03]
    hover:shadow-xl
    active:scale-95
    transition-all
    duration-300
    cursor-pointer
    "
  >
    Add Product
  </button>


</div>
